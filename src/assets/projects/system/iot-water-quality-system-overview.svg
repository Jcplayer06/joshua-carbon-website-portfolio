2="737.0" y2="369"/><rect class="node" x="740.0" y="313" width="206.0" height="112" rx="7"/><text x="750.0" y="339" class="n">04</text><text x="750.0" y="366" class="nt">Mobile</text><text x="750.0" y="382" class="nt">Application</text><text x="750.0" y="404" class="ns">Remote Monitoring</text><text x="74" y="500" class="foot">INPUT  →  PROCESS  →  OUTPUT</text><rect class="panel" x="1000" y="225" width="386" height="300" rx="10"/><text x="1024" y="255" class="label">TECH STACK / TOOLS</text><rect class="chip" x="1024" y="285" width="166" height="32" rx="5"/><text x="1033" y="298" class="n">01</text><text x="1058" y="306" class="ct" style="font-size:11px">ATmega328P</text><rect class="chip" x="1208" y="285" width="166" height="32" rx="5"/><text x="1217" y="298" class="n">02</text><text x="1242" y="306" class="ct" style="font-size:11px">ESP8266</text><rect class="chip" x="1024" y="328" width="166" height="32" rx="5"/><text x="1033" y="341" class="n">03</text><text x="1058" y="349" class="ct" style="font-size:11px">pH Sensor</text><rect class="chip" x="1208" y="328" width="166" height="32" rx="5"/><text x="1217" y="341" class="n">04</text><text x="1242" y="349" class="ct" style="font-size:11px">Turbidity Sensor</text><rect class="chip" x="1024" y="371" width="166" height="32" rx="5"/><text x="1033" y="384" class="n">05</text><text x="1058" y="392" class="ct" style="font-size:11px">Temperature Sensor</text><rect class="chip" x="1208" y="371" width="166" height="32" rx="5"/><text x="1217" y="384" class="n">06</text><text x="1242" y="392" class="ct" style="font-size:11px">TCP/IP</text><rect class="chip" x="1024" y="414" width="166" height="32" rx="5"/><text x="1033" y="427" class="n">07</text><text x="1058" y="435" class="ct" style="font-size:11px">PCB</text><rect class="chip" x="1208" y="414" width="166" height="32" rx="5"/><text x="1217" y="427" class="n">08</text><text x="1242" y="435" class="ct" style="font-size:11px">Mobile Monitoring</text><text x="54" y="565" clas