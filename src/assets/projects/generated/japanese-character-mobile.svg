<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="720" height="2210" viewBox="0 0 720 2210"><ns0:defs><ns0:linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><ns0:stop stop-color="#020b13" /><ns0:stop offset="1" stop-color="#061a28" /></ns0:linearGradient></ns0:defs><ns0:rect width="720" height="2600" fill="url(#g)" /><ns0:g opacity=".32" stroke="#0c3043"><ns0:path d="M0 100H720M0 900H720M0 1900H720" /><ns0:path d="M80 0V2600M360 0V2600M640 0V2600" /></ns0:g><ns0:text x="28" y="52" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">01  AI / COMPUTER VISION</ns0:text><ns0:text x="28" y="102" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38px" font-weight="800"><ns0:tspan x="28" dy="0px">AI-Based Japanese Character</ns0:tspan><ns0:tspan x="28" dy="43px">Recognition</ns0:tspan></ns0:text><ns0:text x="28" y="200" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18px" font-weight="500"><ns0:tspan x="28" dy="0px">A Raspberry Pi-based computer vision system</ns0:tspan><ns0:tspan x="28" dy="25px">using a custom-trained YOLOv5 model to</ns0:tspan><ns0:tspan x="28" dy="25px">recognize Japanese Kanji characters.</ns0:tspan></ns0:text><ns0:rect x="28" y="280" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="280" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="314" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">PURPOSE</ns0:text><ns0:text x="50" y="358" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">Kanji recognition</ns0:text><ns0:text x="50" y="392" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">Detect and classify Japanese Kanji characters.</ns0:tspan></ns0:text><ns0:rect x="28" y="478" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="478" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="512" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">BUILD</ns0:text><ns0:text x="50" y="556" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">Custom YOLOv5 model</ns0:text><ns0:text x="50" y="590" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">Python + YOLOv5, trained with Roboflow/Colab.</ns0:tspan></ns0:text><ns0:rect x="28" y="676" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="676" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="710" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">INTEGRATION</ns0:text><ns0:text x="50" y="754" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">Camera → inference → output</ns0:text><ns0:text x="50" y="788" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">Camera/image → model inference → bounding boxes/labels.</ns0:tspan></ns0:text><ns0:rect x="28" y="874" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="874" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="908" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">OUTPUT</ns0:text><ns0:text x="50" y="952" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">95.33% reported accuracy</ns0:text><ns0:text x="50" y="986" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">Reported 95.33% across 50 classes and 150 trials.</ns0:tspan></ns0:text><ns0:text x="28" y="1080" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">SYSTEM BUILD · HOW THE PARTS CONNECT</ns0:text><ns0:rect x="28" y="1104" width="664" height="120" rx="12" fill="#071e2e" stroke="#165978" /><ns0:text x="44" y="1129" fill="#24c2ff" font-family="Consolas,monospace" font-size="10px" font-weight="800" text-anchor="start" letter-spacing="0px">01</ns0:text><ns0:text x="44" y="1166" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="780"><ns0:tspan x="44" dy="0px">Input</ns0:tspan></ns0:text><ns0:text x="44" y="1196" fill="#7ea3b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" font-weight="500"><ns0:tspan x="44" dy="0px">Webcam / image</ns0:tspan></ns0:text><ns0:line x1="360.0" y1="1224" x2="351.0" y2="1246" stroke="#24c2ff" stroke-width="2.5" /><ns0:polygon points="360.0,1246 350.0,1240 350.0,1252" fill="#24c2ff" /><ns0:rect x="28" y="1246" width="664" height="120" rx="12" fill="#071e2e" stroke="#165978" /><ns0:text x="44" y="1271" fill="#24c2ff" font-family="Consolas,monospace" font-size="10px" font-weight="800" text-anchor="start" letter-spacing="0px">02</ns0:text><ns0:text x="44" y="1308" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="780"><ns0:tspan x="44" dy="0px">YOLOv5</ns0:tspan></ns0:text><ns0:text x="44" y="1338" fill="#7ea3b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" font-weight="500"><ns0:tspan x="44" dy="0px">Model inference</ns0:tspan></ns0:text><ns0:line x1="360.0" y1="1366" x2="351.0" y2="1388" stroke="#24c2ff" stroke-width="2.5" /><ns0:polygon points="360.0,1388 350.0,1382 350.0,1394" fill="#24c2ff" /><ns0:rect x="28" y="1388" width="664" height="120" rx="12" fill="#071e2e" stroke="#165978" /><ns0:text x="44" y="1413" fill="#24c2ff" font-family="Consolas,monospace" font-size="10px" font-weight="800" text-anchor="start" letter-spacing="0px">03</ns0:text><ns0:text x="44" y="1450" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="780"><ns0:tspan x="44" dy="0px">Detection</ns0:tspan></ns0:text><ns0:text x="44" y="1480" fill="#7ea3b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" font-weight="500"><ns0:tspan x="44" dy="0px">Bounding box + label</ns0:tspan></ns0:text><ns0:line x1="360.0" y1="1508" x2="351.0" y2="1530" stroke="#24c2ff" stroke-width="2.5" /><ns0:polygon points="360.0,1530 350.0,1524 350.0,1536" fill="#24c2ff" /><ns0:rect x="28" y="1530" width="664" height="120" rx="12" fill="#071e2e" stroke="#165978" /><ns0:text x="44" y="1555" fill="#24c2ff" font-family="Consolas,monospace" font-size="10px" font-weight="800" text-anchor="start" letter-spacing="0px">04</ns0:text><ns0:text x="44" y="1592" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="780"><ns0:tspan x="44" dy="0px">NMS</ns0:tspan></ns0:text><ns0:text x="44" y="1622" fill="#7ea3b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" font-weight="500"><ns0:tspan x="44" dy="0px">Remove redundant boxes</ns0:tspan></ns0:text><ns0:line x1="360.0" y1="1650" x2="351.0" y2="1672" stroke="#24c2ff" stroke-width="2.5" /><ns0:polygon points="360.0,1672 350.0,1666 350.0,1678" fill="#24c2ff" /><ns0:rect x="28" y="1672" width="664" height="120" rx="12" fill="#071e2e" stroke="#165978" /><ns0:text x="44" y="1697" fill="#24c2ff" font-family="Consolas,monospace" font-size="10px" font-weight="800" text-anchor="start" letter-spacing="0px">05</ns0:text><ns0:text x="44" y="1734" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="780"><ns0:tspan x="44" dy="0px">Tkinter</ns0:tspan></ns0:text><ns0:text x="44" y="1764" fill="#7ea3b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" font-weight="500"><ns0:tspan x="44" dy="0px">Display result</ns0:tspan></ns0:text><ns0:text x="28" y="1822" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">TECH STACK / TOOLS</ns0:text><ns0:rect x="28.0" y="1844" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="42.0" y="1884" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">Python</ns0:text><ns0:rect x="369.0" y="1844" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="383.0" y="1884" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">YOLOv5</ns0:text><ns0:rect x="28.0" y="1922" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="42.0" y="1962" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">Roboflow</ns0:text><ns0:rect x="369.0" y="1922" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="383.0" y="1962" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">OpenCV</ns0:text><ns0:rect x="28.0" y="2000" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="42.0" y="2040" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">Google Colab</ns0:text><ns0:rect x="369.0" y="2000" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="383.0" y="2040" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">Raspberry Pi</ns0:text><ns0:rect x="28.0" y="2078" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="42.0" y="2118" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">Tkinter</ns0:text><ns0:text x="28" y="2180" fill="#7ea3b4" font-family="Consolas,monospace" font-size="9px" font-weight="800" text-anchor="start" letter-spacing="0.8px">VERIFIED PROJECT VISUAL · CONCISE TECHNICAL SUMMARY</ns0:text></ns0:svg>