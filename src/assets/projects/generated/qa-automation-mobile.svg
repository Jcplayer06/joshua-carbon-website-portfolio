<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="720" height="2167" viewBox="0 0 720 2167"><ns0:defs><ns0:linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><ns0:stop stop-color="#020b13" /><ns0:stop offset="1" stop-color="#061a28" /></ns0:linearGradient></ns0:defs><ns0:rect width="720" height="2600" fill="url(#g)" /><ns0:g opacity=".32" stroke="#0c3043"><ns0:path d="M0 100H720M0 900H720M0 1900H720" /><ns0:path d="M80 0V2600M360 0V2600M640 0V2600" /></ns0:g><ns0:text x="28" y="52" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">03  QA AUTOMATION</ns0:text><ns0:text x="28" y="102" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38px" font-weight="800"><ns0:tspan x="28" dy="0px">QA Automation Framework</ns0:tspan></ns0:text><ns0:text x="28" y="157" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18px" font-weight="500"><ns0:tspan x="28" dy="0px">A Python web-automation framework using Robot</ns0:tspan><ns0:tspan x="28" dy="25px">Framework, Selenium, and SeleniumLibrary for</ns0:tspan><ns0:tspan x="28" dy="25px">structured browser testing and reporting.</ns0:tspan></ns0:text><ns0:rect x="28" y="237" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="237" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="271" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">PURPOSE</ns0:text><ns0:text x="50" y="315" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">Repeatable web testing</ns0:text><ns0:text x="50" y="349" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">Run repeatable browser tests with reusable automation.</ns0:tspan></ns0:text><ns0:rect x="28" y="435" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="435" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="469" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">BUILD</ns0:text><ns0:text x="50" y="513" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">Reusable test framework</ns0:text><ns0:text x="50" y="547" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">Python + Robot Framework + Selenium/SeleniumLibrary.</ns0:tspan></ns0:text><ns0:rect x="28" y="633" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="633" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="667" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">INTEGRATION</ns0:text><ns0:text x="50" y="711" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">Robot → Selenium → reports</ns0:text><ns0:text x="50" y="745" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">Test cases → keywords/actions → browser → evidence.</ns0:tspan></ns0:text><ns0:rect x="28" y="831" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="831" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="865" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">OUTPUT</ns0:text><ns0:text x="50" y="909" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">Execution + reports</ns0:text><ns0:text x="50" y="943" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">Reusable execution, reporting, and optional AI-assisted</ns0:tspan><ns0:tspan x="50" dy="22px">analysis.</ns0:tspan></ns0:text><ns0:text x="28" y="1037" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">SYSTEM BUILD · HOW THE PARTS CONNECT</ns0:text><ns0:rect x="28" y="1061" width="664" height="120" rx="12" fill="#071e2e" stroke="#165978" /><ns0:text x="44" y="1086" fill="#24c2ff" font-family="Consolas,monospace" font-size="10px" font-weight="800" text-anchor="start" letter-spacing="0px">01</ns0:text><ns0:text x="44" y="1123" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="780"><ns0:tspan x="44" dy="0px">Test cases</ns0:tspan></ns0:text><ns0:text x="44" y="1153" fill="#7ea3b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" font-weight="500"><ns0:tspan x="44" dy="0px">Robot Framework</ns0:tspan></ns0:text><ns0:line x1="360.0" y1="1181" x2="351.0" y2="1203" stroke="#24c2ff" stroke-width="2.5" /><ns0:polygon points="360.0,1203 350.0,1197 350.0,1209" fill="#24c2ff" /><ns0:rect x="28" y="1203" width="664" height="120" rx="12" fill="#071e2e" stroke="#165978" /><ns0:text x="44" y="1228" fill="#24c2ff" font-family="Consolas,monospace" font-size="10px" font-weight="800" text-anchor="start" letter-spacing="0px">02</ns0:text><ns0:text x="44" y="1265" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="780"><ns0:tspan x="44" dy="0px">Keywords</ns0:tspan></ns0:text><ns0:text x="44" y="1295" fill="#7ea3b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" font-weight="500"><ns0:tspan x="44" dy="0px">Reusable actions</ns0:tspan></ns0:text><ns0:line x1="360.0" y1="1323" x2="351.0" y2="1345" stroke="#24c2ff" stroke-width="2.5" /><ns0:polygon points="360.0,1345 