="435.5" y="251" width="355.5" height="195" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="435.5" y="251" width="5" height="195" rx="2" fill="#24c2ff" /><ns0:text x="457.5" y="285" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">BUILD</ns0:text><ns0:text x="457.5" y="329" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">ESP8266 + IR sensors</ns0:text><ns0:text x="457.5" y="363" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="457.5" dy="0px">ESP8266 reads slot sensors over</ns0:tspan><ns0:tspan x="457.5" dy="22px">Wi-Fi.</ns0:tspan></ns0:text><ns0:rect x="809.0" y="251" width="355.5" height="195" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="809.0" y="251" width="5" height="195" rx="2" fill="#24c2ff" /><ns0:text x="831.0" y="285" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">INTEGRATION</ns0:text><ns0:text x="831.0" y="329" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">Sensors â†’ Wi-Fi â†’ Blynk</ns0:text><ns0:text x="831.0" y="363" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="831.0" dy="0px">IR slot sensors â†’ ESP8266 â†’ Blynk</ns0:tspan><ns0:tspan x="831.0" dy="22px">mobile status.</ns0:tspan></ns0:text><ns0:rect x="1182.5" y="251" width="355.5" height="195" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="1182.5" y="251" width="5" height="195" rx="2" fill="#24c2ff" /><ns0:text x="1204.5" y="285" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">OUTPUT</ns0:text><ns0:text x="1204.5" y="329" fill="#f5fbff" font-famil