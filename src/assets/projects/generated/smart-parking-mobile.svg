<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="720" height="1947" viewBox="0 0 720 1947"><ns0:defs><ns0:linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><ns0:stop stop-color="#020b13" /><ns0:stop offset="1" stop-color="#061a28" /></ns0:linearGradient></ns0:defs><ns0:rect width="720" height="2600" fill="url(#g)" /><ns0:g opacity=".32" stroke="#0c3043"><ns0:path d="M0 100H720M0 900H720M0 1900H720" /><ns0:path d="M80 0V2600M360 0V2600M640 0V2600" /></ns0:g><ns0:text x="28" y="52" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">04  IOT / EMBEDDED</ns0:text><ns0:text x="28" y="102" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38px" font-weight="800"><ns0:tspan x="28" dy="0px">Smart Parking System</ns0:tspan></ns0:text><ns0:text x="28" y="157" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18px" font-weight="500"><ns0:tspan x="28" dy="0px">An IoT parking-monitoring system using IR</ns0:tspan><ns0:tspan x="28" dy="25px">sensors and an ESP8266 to detect slot occupancy</ns0:tspan><ns0:tspan x="28" dy="25px">and show status through Blynk.</ns0:tspan></ns0:text><ns0:rect x="28" y="237" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="237" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="271" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">PURPOSE</ns0:text><ns0:text x="50" y="315" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">Parking slot monitoring</ns0:text><ns0:text x="50" y="349" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">Detect occupied and available parking slots.</ns0:tspan></ns0:text><ns0:rect x="28" y="435" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="435" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="469" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">BUILD</ns0:text><ns0:text x="50" y="513" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">ESP8266 + IR sensors</ns0:text><ns0:text x="50" y="547" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">ESP8266 reads slot sensors over Wi-Fi.</ns0:tspan></ns0:text><ns0:rect x="28" y="633" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="633" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="667" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">INTEGRATION</ns0:text><ns0:text x="50" y="711" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">Sensors → Wi-Fi → Blynk</ns0:text><ns0:text x="50" y="745" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">IR slot sensors → ESP8266 → Blynk mobile status.</ns0:tspan></ns0:text><ns0:rect x="28" y="831" width="664" height="180" rx="14" fill="#061723" stroke="#165978" /><ns0:rect x="28" y="831" width="5" height="180" rx="2" fill="#24c2ff" /><ns0:text x="50" y="865" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">OUTPUT</ns0:text><ns0:text x="50" y="909" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25px" font-weight="780" text-anchor="start" letter-spacing="0px">Live slot status</ns0:text><ns0:text x="50" y="943" fill="#b7cad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="500"><ns0:tspan x="50" dy="0px">Real-time parking status through Blynk.</ns0:tspan></ns0:text><ns0:text x="28" y="1037" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">SYSTEM BUILD · HOW THE PARTS CONNECT</ns0:text><ns0:rect x="28" y="1061" width="664" height="120" rx="12" fill="#071e2e" stroke="#165978" /><ns0:text x="44" y="1086" fill="#24c2ff" font-family="Consolas,monospace" font-size="10px" font-weight="800" text-anchor="start" letter-spacing="0px">01</ns0:text><ns0:text x="44" y="1123" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="780"><ns0:tspan x="44" dy="0px">IR sensors</ns0:tspan></ns0:text><ns0:text x="44" y="1153" fill="#7ea3b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" font-weight="500"><ns0:tspan x="44" dy="0px">Slot detection</ns0:tspan></ns0:text><ns0:line x1="360.0" y1="1181" x2="351.0" y2="1203" stroke="#24c2ff" stroke-width="2.5" /><ns0:polygon points="360.0,1203 350.0,1197 350.0,1209" fill="#24c2ff" /><ns0:rect x="28" y="1203" width="664" height="120" rx="12" fill="#071e2e" stroke="#165978" /><ns0:text x="44" y="1228" fill="#24c2ff" font-family="Consolas,monospace" font-size="10px" font-weight="800" text-anchor="start" letter-spacing="0px">02</ns0:text><ns0:text x="44" y="1265" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="780"><ns0:tspan x="44" dy="0px">ESP8266</ns0:tspan></ns0:text><ns0:text x="44" y="1295" fill="#7ea3b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" font-weight="500"><ns0:tspan x="44" dy="0px">Processing + Wi-Fi</ns0:tspan></ns0:text><ns0:line x1="360.0" y1="1323" x2="351.0" y2="1345" stroke="#24c2ff" stroke-width="2.5" /><ns0:polygon points="360.0,1345 350.0,1339 350.0,1351" fill="#24c2ff" /><ns0:rect x="28" y="1345" width="664" height="120" rx="12" fill="#071e2e" stroke="#165978" /><ns0:text x="44" y="1370" fill="#24c2ff" font-family="Consolas,monospace" font-size="10px" font-weight="800" text-anchor="start" letter-spacing="0px">03</ns0:text><ns0:text x="44" y="1407" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="780"><ns0:tspan x="44" dy="0px">Blynk</ns0:tspan></ns0:text><ns0:text x="44" y="1437" fill="#7ea3b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" font-weight="500"><ns0:tspan x="44" dy="0px">Cloud / mobile app</ns0:tspan></ns0:text><ns0:line x1="360.0" y1="1465" x2="351.0" y2="1487" stroke="#24c2ff" stroke-width="2.5" /><ns0:polygon points="360.0,1487 350.0,1481 350.0,1493" fill="#24c2ff" /><ns0:rect x="28" y="1487" width="664" height="120" rx="12" fill="#071e2e" stroke="#165978" /><ns0:text x="44" y="1512" fill="#24c2ff" font-family="Consolas,monospace" font-size="10px" font-weight="800" text-anchor="start" letter-spacing="0px">04</ns0:text><ns0:text x="44" y="1549" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="780"><ns0:tspan x="44" dy="0px">Status</ns0:tspan></ns0:text><ns0:text x="44" y="1579" fill="#7ea3b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" font-weight="500"><ns0:tspan x="44" dy="0px">Parking availability</ns0:tspan></ns0:text><ns0:text x="28" y="1637" fill="#24c2ff" font-family="Consolas,monospace" font-size="12px" font-weight="800" text-anchor="start" letter-spacing="0px">TECH STACK / TOOLS</ns0:text><ns0:rect x="28.0" y="1659" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="42.0" y="1699" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">ESP8266</ns0:text><ns0:rect x="369.0" y="1659" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="383.0" y="1699" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">IR Sensors</ns0:text><ns0:rect x="28.0" y="1737" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="42.0" y="1777" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">Blynk</ns0:text><ns0:rect x="369.0" y="1737" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="383.0" y="1777" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">Arduino IDE</ns0:text><ns0:rect x="28.0" y="1815" width="323.0" height="66" rx="10" fill="#071e2e" stroke="#165978" /><ns0:text x="42.0" y="1855" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start" letter-spacing="0px">C/C++ (Arduino)</ns0:text><ns0:text x="28" y="1917" fill="#7ea3b4" font-family="Consolas,monospace" font-size="9px" font-weight="800" text-anchor="start" letter-spacing="0.8px">VERIFIED PROJECT VISUAL · CONCISE TECHNICAL SUMMARY</ns0:text></ns0:svg>